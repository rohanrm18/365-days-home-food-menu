name: Build iPhone app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project files
        run: flutter create --platforms=ios --org com.prasad.homefood .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Remove Flutter template test generated during iOS setup
        run: rm -f test/widget_test.dart
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run tests
        run: flutter test
      - name: Build iOS release app (unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned iPhone IPA for free-Apple-ID sideloading
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -qr ../../../365-days-home-food-iphone-unsigned.ipa Payload
      - name: Package unsigned iOS app for inspection
        run: |
          cd build/ios/iphoneos
          zip -qr ../../../365-days-home-food-iphone-unsigned.zip Runner.app
      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: 365-days-home-food-iphone-unsigned-ipa
          path: 365-days-home-food-iphone-unsigned.ipa
          retention-days: 14
      - name: Upload unsigned iOS app inspection package
        uses: actions/upload-artifact@v4
        with:
          name: 365-days-home-food-iphone-unsigned
          path: 365-days-home-food-iphone-unsigned.zip
          retention-days: 14
