name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'tool/**'
      - '.github/workflows/**'
      - 'README.md'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --org com.prasad.homefood .
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Configure scheduled notification receivers
        run: python3 tool/patch_android_manifest.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: 365-days-home-food-menu-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
