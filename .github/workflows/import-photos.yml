name: Import dish photos from ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'photos-upload/*.zip'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Unpack photos into assets/meals
        run: python3 tool/import_photos.py
      - name: Commit the photos
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/meals photos-upload
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new photos to commit."
          else
            git commit -m "Add dish photos from ZIP upload"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the web app and the APK
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
          gh workflow run build-android-web.yml --ref main
